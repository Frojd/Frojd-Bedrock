{% raw -%}
# WordPress Bedrock: reusable Deploy workflow. Runs composer + frontend builds
# in parallel with caching, then deploys with Ansible. Called by ci.yml after
# quality gates pass, or run manually via workflow_dispatch for rollbacks.
#
# Required secrets: ACF_PRO_KEY, SSH_PRIVATE_KEY.

name: Deploy

# run-name sets the bold title in the Actions run list. A manual run shows the
# chosen environment, the ref and who triggered it; an automatic (push) run
# shows the triggering ref.
run-name: >-
  Deploy #${{ github.run_number }} ${{ github.event_name == 'workflow_dispatch'
    && format('→ {0} ({1}): Manually run by {2}', inputs.environment, inputs.ref != '' && inputs.ref || github.ref_name, github.actor)
    || format('({0})', github.ref_name) }}

on:
  workflow_call:
    secrets:
      ACF_PRO_KEY:
        required: true
      SSH_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
      ref:
        description: 'Git ref to deploy (tag, branch or SHA). Empty = current ref.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Cache Composer packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      # Render auth.example.json → auth.json with the ACF_PRO_KEY secret. Using
      # sed (not `composer config`) keeps the key out of the process list.
      - name: Configure ACF Pro Composer auth
        env:
          ACF_PRO_KEY: ${{ secrets.ACF_PRO_KEY }}
        run: |
          sed "s|%%ACF_PRO_KEY%%|$ACF_PRO_KEY|" auth.example.json > auth.json
          chmod 600 auth.json

      - name: Install dependencies
        run: composer install --no-progress --no-scripts --optimize-autoloader --no-dev

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main
          retention-days: 1
          path: |
            vendor
            src
            !src/app/themes/main/frontend/node_modules

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: src/app/themes/main/frontend/.nvmrc

      - name: Build frontend
        working-directory: src/app/themes/main/frontend
        run: npm ci && npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend
          retention-days: 1
          path: src/app/themes/main/dist
          include-hidden-files: true

  deploy:
    # Target is production on a v* tag push OR a manual run that selects the
    # "production" environment; staging otherwise. Honoring the dispatch input
    # (not just the ref) lets a manual run deploy a branch to production.
    name: Deploy to ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'production') && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    needs: [composer, frontend]
    env:
      STAGE: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'production') && 'prod' || 'stage' }}
    concurrency:
      group: deploy-${{ (startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'production') && 'production' || 'staging' }}
      cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'production') }}
    # GitHub Environment names are stage/prod (repo Settings → Environments),
    # the fleet-wide convention — distinct from the staging/production labels
    # shown in the dispatch dropdown and run name.
    environment:
      name: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'production') && 'prod' || 'stage' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: main
          path: .

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend
          path: src/app/themes/main/dist

      - name: Setup Ansible
        run: cd deploy && pip install -r requirements.txt && ansible-galaxy install -r requirements.yml

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H {% endraw %}{{cookiecutter.ssh_host_prod}} {{cookiecutter.ssh_host_stage}}{% raw %} >> ~/.ssh/known_hosts

      - name: Run ansible with stage ${{ env.STAGE }}
        run: cd deploy && ansible-playbook deploy.yml -i "stages/${STAGE}.yml"

  # FROJD-CICD-020: CycloneDX SBOM on production releases (v* tags, or a manual
  # production dispatch).
  security-sbom:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'production'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'sbom.cdx.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
{% endraw %}