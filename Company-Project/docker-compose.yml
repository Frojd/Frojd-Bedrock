services:
    search:
        image: elasticsearch:7.17.28
        ports:
            - "8083:9200"
        environment:
            - discovery.type=single-node

    db:
        image: mariadb:10.6
        ports:
            - "8082:3306"
        volumes:
            - ./docker/files/db-dumps/:/docker-entrypoint-initdb.d/:cached
        env_file: "./docker/config/db.env"

    php-fpm:
        build:
            context: docker/php-fpm
        environment:
            XDEBUG_MODE: develop,debug
            XDEBUG_CONFIG: "
                client_host=host.docker.internal
                start_with_request=yes
              "
        working_dir: /app
        volumes:
            - ./src:/app/src:cached
            # Fail if web.env is missing instead of creating a stray directory.
            - type: bind
              source: ./docker/config/web.env
              target: /app/.env
              bind:
                  create_host_path: false
            - ./vendor:/app/vendor:cached
            - ./config:/app/config:cached
            - ./docker/files/profiles:/app/profiles:delegated
            - ./docker/php-fpm/php-ini-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini:cached

    web:
        image: nginx:stable-alpine
        working_dir: /app
        ports:
            - "8080:80"
            - "8081:443"
        links:
            - db
            - search
            - php-fpm
        volumes:
            - ./docker/files/certs:/etc/certs:cached
            - ./docker/files/config/nginx.conf:/etc/nginx/conf.d/default.conf:cached
            - ./src:/app/src:cached

    wp-cli:
        image: ghcr.io/frojd/dockerimages/wp-cli-php-8.3:latest
        # On-demand tool container (run via `docker compose run wp-cli ...` or
        # `make wp ...`); the profile keeps it out of the default `up` set.
        profiles: ["tools"]
        links:
            - db
        volumes:
            - ./src:/app/src:delegated
            - ./wp-cli.yml:/app/wp-cli.yml:cached
            - ./vendor:/app/vendor:cached
            # Fail if web.env is missing instead of creating a stray directory.
            - type: bind
              source: ./docker/config/web.env
              target: /app/.env
              bind:
                  create_host_path: false
            - ./config:/app/config:cached
            - ./docker/files/db-dumps:/app/db-dumps

    composer:
        image: ghcr.io/frojd/dockerimages/composer-php-8.3:latest
        # On-demand tool container (run via `docker compose run composer ...` or
        # `make composer ...`); the profile keeps it out of the default `up` set.
        profiles: ["tools"]
        volumes:
            - ./src:/app/src
            - ./composer.json:/app/composer.json
            - "./composer.lock:/app/composer.lock"
            # Fail if these are missing instead of creating stray directories.
            - type: bind
              source: ./auth.json
              target: /app/auth.json
              bind:
                  create_host_path: false
            - type: bind
              source: ./docker/config/web.env
              target: /app/.env
              bind:
                  create_host_path: false
            - ./vendor:/app/vendor
