{% raw -%}
- name: Restart PHP
  service: name=php8.3-fpm state=restarted
  become: true
  run_once: true

- name: Restart nginx
  service: name=nginx state=reloaded
  become: true
  run_once: true

- name: Flush permalinks
  shell: chdir="{{ ansistrano_release_path.stdout }}"
    wp rewrite flush

- name: Flush cache
  shell: chdir="{{ ansistrano_release_path.stdout }}"
    wp cache flush
{% endraw %}
